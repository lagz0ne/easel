name: gates

# Trunk-based CI: every push to main gets one verdict. The weekly run
# catches drift in what the lockfile does not pin (runner image, registry).

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A newer push re-checks the whole tree, so an older run on the same ref may stop.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image: Chromium for the browser test project (tests/browser) and its
    # system libraries are in it, so no run installs a browser. Its tag is the `playwright`
    # version in package.json: move both in one commit.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # A real Postgres for the Bun.sql driver tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      # A job in a container reaches a service by its name, with no port map.
      PG_URL: postgres://postgres:postgres@postgres:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bun from npm: setup-bun needs `unzip`, and the image has none. npm is in the image.
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile
      # Fails here, with one clear line, when the image tag and package.json name two versions.
      - name: The image has the browser this Playwright wants
        run: test -x "$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
      # Bun-first: from here on, a call to `node` fails the run.
      - name: Block node
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          printf '#!/bin/sh\necho "node called: this app runs on Bun only" >&2\nexit 1\n' > "$RUNNER_TEMP/no-node/node"
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"
      - name: node is blocked
        run: "! node --version"
      # Typecheck, tests, and the build with its client check.
      - run: bun run check
      # Format and lint (vp check).
      - run: bun run check:style
      # No plain helper functions: every named function is an operation.
      - run: bun run check:plain

  # The statecharts are the oracle (SPEC-*.md, docs/statecharts/): TLC checks each model, and each
  # page's chart must be the one its model makes. ship.sh ran this before the push; now it runs
  # here, so a ship stays fast. Java and TLC come from scripts/tlc.sh, cached.
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/easel/tlc
          key: tlc-${{ hashFiles('scripts/tlc.sh') }}
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bash scripts/statecharts.sh --check

  # The speed gate (SPEC-speed.md § The design 3): the tree against the commit before the push, on
  # the built binary in Chromium. A step over its budget (or a request before `easel:open` that is
  # not on the hot path list) makes the job red: `gates` is red, so the job rollback puts the
  # live site back on the last green commit, and `trunk-status` opens `trunk-red`. A step only slower than the base gives an alert: the job
  # `speed-alert` opens a `speed-slower` issue, and blocks nothing.
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # A push names the commit before it; a weekly or manual run takes the commit before HEAD.
      BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
    outputs:
      alert: ${{ steps.gate.outputs.alert }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile
      # git in the container: the checkout's owner is not the job's user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The gate
        id: gate
        shell: bash
        run: |
          base="${BASE:-$(git rev-parse HEAD^)}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          set +e
          bun run speed -- --gate --base "$base" 2>&1 | tee speed.log
          code="${PIPESTATUS[0]}"
          set -e
          if grep -q '^speed: alert' speed.log; then
            { echo "alert<<SPEED_EOF"; grep '^speed: ' speed.log; echo "SPEED_EOF"; } >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

  # An alert of the speed gate: one open `speed-slower` issue, with a comment for each new alert.
  speed-alert:
    needs: speed
    if: needs.speed.outputs.alert != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT: ${{ needs.speed.outputs.alert }}
      BASE: ${{ needs.speed.outputs.base }}
    steps:
      - name: Open or comment the speed-slower issue
        run: |
          body="Commit \`$GITHUB_SHA\` against the base \`$BASE\`.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          \`\`\`
          $ALERT
          \`\`\`"
          open=$(gh issue list --state open --label speed-slower --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create speed-slower --color FBCA04 --description "a step is slower than its base" --force
            gh issue create --title "speed: slower than the base at ${GITHUB_SHA:0:7}" --label speed-slower --body "$body"
          fi

  # Deploy first (deploy.yml): this push may be live already. When a gate is red on main, put
  # :latest back on the newest green commit that has an image, and deploy it. A newer push that
  # is live already is left alone: its own gates judge it (it has this change too).
  rollback:
    needs: [check, charts, speed]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    environment:
      name: production
      url: https://easel.vibea.dev
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
      SITE: https://easel.vibea.dev
      IMAGE: ghcr.io/lagz0ne/easel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the last green commit live
        run: |
          live=$(curl -fsS --max-time 5 "$SITE/api/version" | jq -r '.commit' || true)
          if [ -n "$live" ] && [ "$live" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$live" 2>/dev/null; then
            echo "::notice::the live commit $live is newer than $GITHUB_SHA: its own gates judge it."
            exit 0
          fi
          good=""
          for sha in $(gh run list -w gates -b main --status success -L 30 --json headSha --jq '.[].headSha'); do
            [ "$sha" != "$GITHUB_SHA" ] || continue
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null || continue
            if docker buildx imagetools inspect "$IMAGE:$sha" >/dev/null 2>&1; then good=$sha; break; fi
          done
          if [ -z "$good" ]; then
            echo "::error::no green commit with an image: roll back by hand (scripts/ship.sh -r, or Dokploy)."
            exit 1
          fi
          echo "rollback: $IMAGE:$good is :latest again"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$good"
          if [ -z "$HOOK" ]; then echo "::notice::DOKPLOY_DEPLOY_HOOK is not set: no deploy."; exit 0; fi
          curl -fsS --max-time 30 -X POST "$HOOK" -H 'content-type: application/json' -d '{}'
          for _ in $(seq 150); do
            now=$(curl -fsS --max-time 5 "$SITE/api/version" | jq -r '.commit' || true)
            if [ "$now" = "$good" ]; then echo "live again: $good"; exit 0; fi
            sleep 2
          done
          echo "::error::$SITE/api/version did not name $good in 5 minutes"
          exit 1
