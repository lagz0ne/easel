name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    outputs:
      build: ${{ steps.build.outputs.build }}
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://easel.vibea.dev
    env:
      HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
      SITE: https://easel.vibea.dev
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: build
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.sha }}
          path: dist/server
          retention-days: 1
      - uses: imjasonh/setup-crane@v0.4
      - id: base
        run: |
          base="ghcr.io/lagz0ne/easel-runtime:$(sha256sum Dockerfile | cut -c1-16)"
          echo "image=$base" >> "$GITHUB_OUTPUT"
          if crane manifest "$base" >/dev/null 2>&1; then echo "have=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.base.outputs.have != '1'
        uses: docker/setup-buildx-action@v4
      - if: steps.base.outputs.have != '1'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.base.outputs.have != '1'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image of this commit
        env:
          BASE: ${{ steps.base.outputs.image }}
          BUILD: ${{ steps.build.outputs.build }}
          IMAGE: ghcr.io/lagz0ne/easel
        run: |
          mkdir -p "$RUNNER_TEMP/layer/app"
          install -m 755 dist/server "$RUNNER_TEMP/layer/app/server"
          tar --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/layer" -c app/server \
            | pigz -1 > "$RUNNER_TEMP/layer.tar.gz"
          crane mutate "$BASE" --append "$RUNNER_TEMP/layer.tar.gz" -t "$IMAGE:$SHA" \
            --env "GIT_SHA=$SHA" --env "BUILD=$BUILD" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SHA"
          crane tag "$IMAGE:$SHA" latest
      - name: Call the Dokploy deploy hook
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::DOKPLOY_DEPLOY_HOOK is not set: image pushed, deploy skipped."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$HOOK" -H 'content-type: application/json' -d '{}'

  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
      SITE: https://easel.vibea.dev
      BUILD: ${{ needs.deploy.outputs.build }}
    environment:
      name: production
      url: https://easel.vibea.dev
    steps:
      - name: The site serves this build
        if: env.HOOK != ''
        run: |
          for _ in $(seq 300); do
            live=$(curl -fsS --max-time 5 "$SITE/api/version" | jq -r '.build' || true)
            if [ -n "$live" ] && [ "$live" -ge "$BUILD" ] 2>/dev/null; then echo "live: build $live"; exit 0; fi
            sleep 1
          done
          echo "::error::$SITE/api/version did not reach build $BUILD in 5 minutes (it says ${live:-nothing})"
          exit 1

  screens:
    needs: [deploy, live]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    concurrency:
      group: screens-main
      cancel-in-progress: false
    environment:
      name: production
      url: https://easel.vibea.dev
    env:
      HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
      EASEL_TOKEN: ${{ secrets.EASEL_TOKEN }}
      EASEL_SERVER: https://easel.vibea.dev
      BUILD: ${{ needs.deploy.outputs.build }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ github.sha }}
          path: dist
      - name: The live screens of this build on the page Live of product
        if: env.HOOK != '' && env.EASEL_TOKEN != ''
        run: |
          chmod +x dist/server
          bun scripts/live-screens.ts --binary dist/server --build "$BUILD" --commit "$GIT_SHA"
      - name: The map of each screen of src/live/screens.ts on its page of product
        if: ${{ !cancelled() && env.HOOK != '' && env.EASEL_TOKEN != '' }}
        run: |
          chmod +x dist/server
          bun scripts/map-screens.ts --binary dist/server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screens-${{ github.sha }}
          path: ${{ runner.temp }}/easel-live-*.png
          if-no-files-found: ignore

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: build
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build:client
      - name: The three binaries and SHA256SUMS
        run: bash scripts/release-binaries.sh "$RUNNER_TEMP/release"
      - name: Put them on the release build-${{ steps.build.outputs.build }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ steps.build.outputs.build }}
          SHA: ${{ env.SHA }}
          DIR: ${{ runner.temp }}/release
        run: |
          files=("$DIR"/easel-darwin-arm64 "$DIR"/easel-linux-x64 "$DIR"/easel-linux-arm64 "$DIR"/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$SHA" --title "easel $TAG" \
              --notes "The easel command line of commit $SHA. Install it from your easel: curl -fsSL https://<your easel>/install.sh | sh"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
