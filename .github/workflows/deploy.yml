name: deploy

# Continuous deployment, deploy first: each push to main goes live at https://easel.vibea.dev in
# about 45 s. `gates` runs at the same time; a red gate on main puts :latest back on the last
# green commit (gates.yml, job rollback), and trunk-status opens `trunk-red`. The user chose
# speed over a gate in front (2026-11-23: "less than a minute ... low risk state").
#
# The job deploy builds the binary on the runner (~10 s), then adds it as one layer to the
# runtime base with crane (Dockerfile, stage runtime): no docker build. It pushes
# ghcr.io/lagz0ne/easel as :<sha> and :latest, calls Dokploy's deploy hook, and is
# green only when the public site's /api/version names this commit. The job binaries puts the
# command line of that build on the GitHub release build-<n>; the deploy does not wait for it.
# A docs-only push (*.md) deploys nothing: its image would be the same app.
#
# Rollback by hand: `scripts/ship.sh -r <sha>`, or
# in Dokploy set the image to ghcr.io/lagz0ne/easel:<good sha> and deploy.
#
# Secret DOKPLOY_DEPLOY_HOOK (environment `production`) is the app's deploy hook URL.
# Without it the image is still pushed and the deploy step is skipped with a notice.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# One deploy at a time, never cancelled mid-deploy. GitHub keeps only the newest waiting run,
# so the site converges on the latest commit. The rollback of gates.yml takes the same group.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://easel.vibea.dev
    env:
      HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
      SITE: https://easel.vibea.dev
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: build
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      - run: bun install --frozen-lockfile
      # Client, server binary, and its checks (no test code in dist), as the stage build does.
      - run: bun run build
      # crane (go-containerregistry), logged in to ghcr.io with this job's token.
      - uses: imjasonh/setup-crane@v0.4
      # The base: the stage runtime of the Dockerfile, tagged by the hash of the Dockerfile. It is
      # built only when the Dockerfile changes.
      - id: base
        run: |
          base="ghcr.io/lagz0ne/easel-runtime:$(sha256sum Dockerfile | cut -c1-16)"
          echo "image=$base" >> "$GITHUB_OUTPUT"
          if crane manifest "$base" >/dev/null 2>&1; then echo "have=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.base.outputs.have != '1'
        uses: docker/setup-buildx-action@v4
      - if: steps.base.outputs.have != '1'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.base.outputs.have != '1'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image: the base and one layer, /app/server, as the last stage of the Dockerfile makes.
      - name: The image of this commit
        env:
          BASE: ${{ steps.base.outputs.image }}
          BUILD: ${{ steps.build.outputs.build }}
          IMAGE: ghcr.io/lagz0ne/easel
        run: |
          mkdir -p "$RUNNER_TEMP/layer/app"
          install -m 755 dist/server "$RUNNER_TEMP/layer/app/server"
          # gzip -1 in parallel (pigz): crane's own gzip of the 144 MB binary takes ~20 s.
          tar --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/layer" -c app/server \
            | pigz -1 > "$RUNNER_TEMP/layer.tar.gz"
          # One push: the base, the layer, the env and the labels.
          crane mutate "$BASE" --append "$RUNNER_TEMP/layer.tar.gz" -t "$IMAGE:$SHA" \
            --env "GIT_SHA=$SHA" --env "BUILD=$BUILD" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SHA"
          crane tag "$IMAGE:$SHA" latest
      - name: Call the Dokploy deploy hook
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::DOKPLOY_DEPLOY_HOOK is not set: image pushed, deploy skipped."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$HOOK" -H 'content-type: application/json' -d '{}'
      - name: The site serves this commit
        if: env.HOOK != ''
        run: |
          for _ in $(seq 150); do
            live=$(curl -fsS --max-time 5 "$SITE/api/version" | jq -r '.commit' || true)
            if [ "$live" = "$SHA" ]; then echo "live: $live"; exit 0; fi
            sleep 2
          done
          echo "::error::$SITE/api/version did not name $SHA in 5 minutes (it names ${live:-nothing})"
          exit 1

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: build
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bun 1.4.4
        run: npm install --global --allow-scripts=bun bun@1.4.4
      # The optional packages of all systems: each binary holds its own Lightning CSS and oxc-parser builds.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build:client
      - name: The three binaries and SHA256SUMS
        run: bash scripts/release-binaries.sh "$RUNNER_TEMP/release"
      - name: Put them on the release build-${{ steps.build.outputs.build }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ steps.build.outputs.build }}
          SHA: ${{ env.SHA }}
          DIR: ${{ runner.temp }}/release
        run: |
          files=("$DIR"/easel-darwin-arm64 "$DIR"/easel-linux-x64 "$DIR"/easel-linux-arm64 "$DIR"/SHA256SUMS)
          # A run again of the same build replaces its files; the sums and the binaries stay one set.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$SHA" --title "easel $TAG" \
              --notes "The easel command line of commit $SHA. Install it from your easel: curl -fsSL https://<your easel>/install.sh | sh"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
